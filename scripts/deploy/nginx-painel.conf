# Painel (client/dist) servido pelo nginx so na interface local; o Cloudflare
# Tunnel leva o dominio do painel ate aqui. Regras de cache iguais as da Vercel.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /var/www/onion-painel/current;
    index index.html;
    access_log off;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Arquivos com hash no nome nunca mudam. Faltando, 404 de verdade: o painel
    # aberto em versao antiga recarrega sozinho (main.jsx) em vez de quebrar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Rotas do painel (SPA): sempre o index.html mais novo.
    location / {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri /index.html;
    }
}
